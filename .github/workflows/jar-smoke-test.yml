name: Cross-platform JAR Smoke Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-jar:
    name: Build JAR once
    runs-on: ubuntu-latest

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Use a plain JDK so JavaFX must come from the application dependencies.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk
          cache: gradle

      - name: Build executable JAR
        run: ./gradlew clean shadowJar

      # Every platform below tests this same file, matching how the submitted JAR is used.
      - name: Share executable JAR
        uses: actions/upload-artifact@v7
        with:
          name: ubis-jar
          path: build/libs/ubis.jar
          if-no-files-found: error
          retention-days: 7

  smoke-test:
    name: Launch JAR on ${{ matrix.platform }}
    needs: build-jar
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      # Deliberately exclude bundled JavaFX so the JAR must provide the correct natives.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk

      - name: Download executable JAR
        uses: actions/download-artifact@v8
        with:
          name: ubis-jar
          path: smoke-test

      - name: Install Linux virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      # Ubis remains open after a successful launch, so reaching the time limit means the
      # JavaFX toolkit and window started without the native-library crash seen in smoke tests.
      - name: Launch JAR on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          timeout 10s xvfb-run --auto-servernum java -Dprism.order=sw -jar smoke-test/ubis.jar > jar-output.log 2>&1
          status=$?
          set -e
          cat jar-output.log

          if [ "$status" -ne 124 ]; then
            echo "The JAR exited before the JavaFX launch check completed."
            exit 1
          fi

      - name: Launch JAR on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          java -Dprism.order=sw -jar smoke-test/ubis.jar > jar-output.log 2>&1 &
          app_pid=$!
          sleep 10

          if ! kill -0 "$app_pid" 2>/dev/null; then
            wait "$app_pid" || true
            cat jar-output.log
            echo "The JAR exited before the JavaFX launch check completed."
            exit 1
          fi

          kill "$app_pid"
          wait "$app_pid" || true
          cat jar-output.log

      - name: Launch JAR on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "java" `
            -ArgumentList @("-Dprism.order=sw", "-jar", "smoke-test/ubis.jar") `
            -PassThru `
            -RedirectStandardOutput "jar-stdout.log" `
            -RedirectStandardError "jar-stderr.log"

          Start-Sleep -Seconds 10

          if ($process.HasExited) {
            Get-Content "jar-stdout.log"
            Get-Content "jar-stderr.log"
            throw "The JAR exited before the JavaFX launch check completed."
          }

          Stop-Process -Id $process.Id
          $process.WaitForExit()
          Get-Content "jar-stdout.log"
          Get-Content "jar-stderr.log"
